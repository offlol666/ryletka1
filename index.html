<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рулетка подарков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; text-align: center; overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { margin-bottom: 5px; }
        
        /* --- Окно рулетки --- */
        .roulette-window {
            width: 100%;
            height: 110px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 14px;
            margin: 20px 0;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 2px solid var(--tg-theme-hint-color, #ccc);
        }

        /* Стоп-линия (по центру) */
        .stop-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: rgba(255, 59, 48, 0.9);
            transform: translateX(-50%);
            z-index: 10;
            border-radius: 2px;
            pointer-events: none;
        }

        /* Лента с подарками */
        .gifts-track {
            display: flex;
            position: absolute;
            left: 0;
        }

        /* Элемент одного подарка (квадратная ячейка-картинка) */
        .gift-item {
            width: 110px;  
            height: 110px; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border-right: 1px solid rgba(0,0,0,0.15);
            padding: 6px;  
            background-color: rgba(255, 255, 255, 0.5);
        }

        /* Картинка на всю ячейку */
        .gift-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        /* --- Кнопка --- */
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 12px;
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: opacity 0.2s;
            width: 100%;
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { background-color: var(--tg-theme-hint-color); cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎁 Крутилка подарков</h2>
        <p id="user-greeting" style="color: var(--tg-theme-hint-color);">Загрузка...</p>

        <!-- Окно рулетки -->
        <div class="roulette-window">
            <div class="stop-line"></div>
            <div class="gifts-track" id="gifts-track"></div>
        </div>

        <button class="btn" id="spin-btn" onclick="startSpin()">Крутить за 50 ⭐</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-greeting').innerText = `Привет, ${user.first_name}! Испытай удачу.`;
        }

        const track = document.getElementById('gifts-track');
        const spinBtn = document.getElementById('spin-btn');
        
        // --- ШАНСЫ ВЫПАДЕНИЯ (99.9% для "Пусто") ---
        const allGifts = [
            { id: 1, name: 'Подарок', img: 'https://github.com/offlol666/images/blob/main/ChatGPT%20Image%2015%20%D0%B0%D0%B2%D0%B3.%202026%20%D0%B3.,%2018_06_32.png?raw=true', weight: 0.2 },
            { id: 2, name: 'Пусто', img: 'https://github.com/offlol666/images/blob/main/nVfE3.jpg?raw=true', weight: 999 },
            { id: 3, name: 'Мишка', img: 'https://github.com/offlol666/images/blob/main/F2OLW.jpg?raw=true', weight: 0.3 },
            { id: 4, name: 'Секрет', img: 'https://github.com/offlol666/images/blob/main/CAgfA.jpg?raw=true', weight: 0.3 },
            { id: 5, name: 'Кубок', img: 'https://cdn-icons-png.flaticon.com/512/3112/3112946.png', weight: 0.1 },
            { id: 6, name: 'Монета', img: 'https://cdn-icons-png.flaticon.com/512/1384/1384047.png', weight: 0.1 }
        ];

        const ITEM_WIDTH = 110; 
        const REPEATS = 8;        // Увеличено число циклов для более долгого кручения
        const ANIMATION_TIME = 6000; // Увеличено время до 6 секунд

        // Функция случайного перемешивания массива (Fisher-Yates shuffle)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomIndexWithWeights() {
            const totalWeight = allGifts.reduce((sum, gift) => sum + gift.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < allGifts.length; i++) {
                if (randomNum < allGifts[i].weight) {
                    return i;
                }
                randomNum -= allGifts[i].weight;
            }
            return 0;
        }

        let currentTrackGifts = [];

        function initGifts() {
            track.innerHTML = '';
            currentTrackGifts = [];

            for(let i = 0; i < REPEATS + 2; i++) {
                const shuffledCycle = shuffleArray(allGifts);
                currentTrackGifts.push(...shuffledCycle);
            }

            currentTrackGifts.forEach(gift => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gift-item';
                itemDiv.innerHTML = `<img src="${gift.img}" alt="${gift.name}">`;
                track.appendChild(itemDiv);
            });

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
        }

        initGifts();

        function startSpin() {
            spinBtn.disabled = true;
            spinBtn.innerText = "Крутим...";

            initGifts(); 
            
            const winningIndexOriginal = getRandomIndexWithWeights();
            const winningGift = allGifts[winningIndexOriginal];

            const targetCycle = REPEATS - 1; 
            let targetIndex = -1;

            for (let i = targetCycle * allGifts.length; i < (targetCycle + 1) * allGifts.length; i++) {
                if (currentTrackGifts[i].id === winningGift.id) {
                    targetIndex = i;
                    break;
                }
            }
            if (targetIndex === -1) {
                targetIndex = targetCycle * allGifts.length;
            }

            const containerCenter = (document.querySelector('.roulette-window').offsetWidth / 2) - (ITEM_WIDTH / 2);
            
            // Смещение ближе к правому или левому краю ячейки
            const side = Math.random() < 0.5 ? 1 : -1;
            const randomShift = (35 + Math.random() * 13) * side;

            const finalOffset = -(targetIndex * ITEM_WIDTH - containerCenter + randomShift);

            // Плавность: долгий разгон в начале и мягкое затухание в конце
            track.style.transition = `transform ${ANIMATION_TIME}ms cubic-bezier(0.15, 0.85, 0.1, 1)`;
            track.style.transform = `translateX(${finalOffset}px)`;

            setTimeout(() => {
                track.style.transition = 'none';
                track.style.transform = `translateX(${finalOffset}px)`;

                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить за 50 ⭐";
                
                alert(`🎉 Поздравляем! Вы выиграли: ${winningGift.name}`);
            }, ANIMATION_TIME);
        }
    </script>
</body>
</html>
