<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рулетка подарков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            /* Красивый градиентный фон */
            background: linear-gradient(135deg, #1a1c2c 0%, #4a1942 100%);
            color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; text-align: center; overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            /* Эффект полупрозрачной карточки (стекло) */
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { margin-bottom: 15px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        /* Окно рулетки */
        .roulette-window {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            margin: 20px 0;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .stop-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: #ff3b30;
            box-shadow: 0 0 10px #ff3b30;
            transform: translateX(-50%);
            z-index: 10;
            border-radius: 2px;
        }

        .gifts-track { display: flex; position: absolute; left: 0; }

        .gift-item {
            width: 110px; 
            height: 120px;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            flex-shrink: 0;
            padding: 6px 4px; 
            background: rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .gift-item img {
            width: 70px; 
            height: 70px;
            object-fit: cover; 
            border-radius: 8px;
        }

        .gift-item span {
            font-size: 11px;
            font-weight: 600;
            color: #ddd;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* Кнопка */
        .btn {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: #fff;
            border: none; border-radius: 16px;
            padding: 18px 30px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(229, 46, 113, 0.4);
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #555; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎁 Крутилка подарков</h2>
        <p id="user-greeting" style="color: var(--tg-theme-hint-color);">Загрузка...</p>

        <!-- Окно рулетки -->
        <div class="roulette-window">
            <div class="stop-line"></div>
            <div class="gifts-track" id="gifts-track"></div>
        </div>

        <button class="btn" id="spin-btn" onclick="startSpin()">Крутить за 50 ⭐</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-greeting').innerText = `Привет, ${user.first_name}! Испытай удачу.`;
        }

        const track = document.getElementById('gifts-track');
        const spinBtn = document.getElementById('spin-btn');
        
        // --- ШАНСЫ ВЫПАДЕНИЯ ---
        const allGifts = [
            { id: 1, name: 'Подарок', img: 'https://github.com/offlol666/images/blob/main/ChatGPT%20Image%2015%20%D0%B0%D0%B2%D0%B3.%202026%20%D0%B3.,%2018_06_32.png?raw=true', weight: 0.2 },
            { id: 2, name: 'Пусто', img: 'https://github.com/offlol666/images/blob/main/nVfE3.jpg?raw=true', weight: 999 },
            { id: 3, name: 'Мишка', img: 'https://github.com/offlol666/images/blob/main/ChatGPT%20Image%2015%20%D0%B0%D0%B2%D0%B3.%202026%20%D0%B3.,%2018_26_51.png?raw=true', weight: 0.3 },
            { id: 4, name: 'Секрет', img: 'https://github.com/offlol666/images/blob/main/CAgfA.jpg?raw=true', weight: 0.3 },
            { id: 5, name: 'Кубок', img: 'https://cdn-icons-png.flaticon.com/512/3112/3112946.png', weight: 0.1 },
            { id: 6, name: '1 Звезда', img: 'https://github.com/offlol666/images/blob/main/OIP.webp?raw=true', weight: 0.1 }
        ];

        const ITEM_WIDTH = 110; 
        const REPEATS = 8;        
        const ANIMATION_TIME = 6000; 

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomIndexWithWeights() {
            const totalWeight = allGifts.reduce((sum, gift) => sum + gift.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < allGifts.length; i++) {
                if (randomNum < allGifts[i].weight) {
                    return i;
                }
                randomNum -= allGifts[i].weight;
            }
            return 0;
        }

        let currentTrackGifts = [];

        function initGifts() {
            track.innerHTML = '';
            currentTrackGifts = [];

            for(let i = 0; i < REPEATS + 2; i++) {
                const shuffledCycle = shuffleArray(allGifts);
                currentTrackGifts.push(...shuffledCycle);
            }

            currentTrackGifts.forEach(gift => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gift-item';
                itemDiv.innerHTML = `
                    <img src="${gift.img}" alt="${gift.name}">
                    <span>${gift.name}</span>
                `;
                track.appendChild(itemDiv);
            });

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
        }

        initGifts();

        function startSpin() {
            spinBtn.disabled = true;
            spinBtn.innerText = "Крутим...";

            initGifts(); 
            
            const winningIndexOriginal = getRandomIndexWithWeights();
            const winningGift = allGifts[winningIndexOriginal];

            const targetCycle = REPEATS - 1; 
            let targetIndex = -1;

            for (let i = targetCycle * allGifts.length; i < (targetCycle + 1) * allGifts.length; i++) {
                if (currentTrackGifts[i].id === winningGift.id) {
                    targetIndex = i;
                    break;
                }
            }
            if (targetIndex === -1) {
                targetIndex = targetCycle * allGifts.length;
            }

            const containerCenter = (document.querySelector('.roulette-window').offsetWidth / 2) - (ITEM_WIDTH / 2);
            
            const side = Math.random() < 0.5 ? 1 : -1;
            const randomShift = (35 + Math.random() * 13) * side;

            const finalOffset = -(targetIndex * ITEM_WIDTH - containerCenter + randomShift);

            track.style.transition = `transform ${ANIMATION_TIME}ms cubic-bezier(0.15, 0.85, 0.1, 1)`;
            track.style.transform = `translateX(${finalOffset}px)`;

            setTimeout(() => {
                track.style.transition = 'none';
                track.style.transform = `translateX(${finalOffset}px)`;

                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить за 50 ⭐";
                
                alert(`🎉 Поздравляем! Вы выиграли: ${winningGift.name}`);
            }, ANIMATION_TIME);
        }
    </script>
</body>
</html>
