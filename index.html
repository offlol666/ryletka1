<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рулетка подарков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1a1c2c 0%, #4a1942 100%);
            color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; text-align: center; overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { margin-bottom: 5px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        #status-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
            min-height: 20px;
        }
        
        /* Окно рулетки */
        .roulette-window {
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            margin: 10px 0 20px 0;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .stop-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background-color: #ff3b30;
            box-shadow: 0 0 10px #ff3b30;
            transform: translateX(-50%);
            z-index: 10;
            border-radius: 2px;
        }

        .gifts-track { display: flex; position: absolute; left: 0; align-items: center; }

        /* Карточка предмета */
        .gift-item {
            width: 104px; 
            height: 124px;
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0;
            padding: 8px 6px; 
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin: 0 4px;
        }

        .gift-item img {
            width: 90px; 
            height: 90px;
            object-fit: contain; 
            margin-top: 2px;
        }

        .gift-item span {
            font-size: 11px;
            font-weight: 600;
            color: #d1d1d6;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        #result-message {
            margin: 10px 0;
            font-size: 16px;
            font-weight: 600;
            min-height: 24px;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }

        .btn-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: #fff;
            border: none; border-radius: 16px;
            padding: 16px 15px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(229, 46, 113, 0.4);
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #555; opacity: 0.6; }

        .btn-hint {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
            text-align: center;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
            font-size: 16px;
            padding: 14px 30px;
            width: 100%;
            margin-top: 15px;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

        .buttons-row-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(26, 28, 44, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 75vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 { font-size: 20px; color: #fff; }

        .inventory-list {
            overflow-y: auto;
            max-height: 50vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .inventory-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 14px;
            gap: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .inventory-item img {
            width: 45px; height: 45px; object-fit: cover; border-radius: 8px;
        }

        .inventory-empty {
            text-align: center;
            color: #aaa;
            padding: 40px 0;
            font-size: 16px;
        }

        .close-modal-btn {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎁 Крутилка подарков</h2>
        <div id="status-subtitle">Ваш шанс выиграть приз: 75%</div>

        <!-- Окно рулетки -->
        <div class="roulette-window">
            <div class="stop-line"></div>
            <div class="gifts-track" id="gifts-track"></div>
        </div>

        <!-- Текст результата -->
        <div id="result-message"></div>

        <div class="buttons-row-wrapper">
            <div class="buttons-group">
                <div class="btn-wrapper">
                    <button class="btn" id="spin-btn-10" onclick="startSpin(10)">Крутить за 10 ⭐</button>
                    <div class="btn-hint">Обычные шансы</div>
                </div>
                <div class="btn-wrapper">
                    <button class="btn" id="spin-btn-50" onclick="startSpin(50)">Крутить за 50 ⭐</button>
                    <div class="btn-hint">Увеличение шансы</div>
                </div>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="openInventory()">📦 Инвентарь</button>
    </div>

    <!-- Модальное окно инвентаря -->
    <div class="modal" id="inventory-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📦 Инвентарь</h3>
            </div>
            <div class="inventory-list" id="inventory-list">
                <!-- Сюда динамически добавляются призы -->
            </div>
            <button class="close-modal-btn" onclick="closeInventory()">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : 'guest_' + Math.random();
        
        if (user) {
            document.querySelector('h2').innerText = `🎁 Привет, ${user.first_name}!`;
        }

        // Принудительно возвращаем 0% шанса на победу
        function getUserWinChance(id) {
            return 0; 
        }

        const finalWinChance = getUserWinChance(userId);

        const statusSubtitle = document.getElementById('status-subtitle');
        statusSubtitle.innerText = `Ваш шанс выиграть приз: ${finalWinChance}%`;

        const track = document.getElementById('gifts-track');
        const spinBtn10 = document.getElementById('spin-btn-10');
        const spinBtn50 = document.getElementById('spin-btn-50');
        const resultMsg = document.getElementById('result-message');
        
        const inventoryModal = document.getElementById('inventory-modal');
        const inventoryList = document.getElementById('inventory-list');

        let inventory = [];

        // Устанавливаем 100% веса на «Пусто» и 0% на остальные призы
        const allGifts = [
            { id: 1, name: 'Подарок', img: 'https://github.com/offlol666/images/blob/main/%D0%BF%D0%BE%D0%B4%D0%B0%D1%80%D0%BE%D0%BA.png?raw=true', weight: 0 },
            { id: 2, name: 'Пусто', img: 'https://github.com/offlol666/images/blob/main/%D0%BF%D1%83%D1%81%D1%82%D0%BE.png?raw=true', weight: 100 },
            { id: 3, name: 'Мишка', img: 'https://github.com/offlol666/images/blob/main/%D0%BC%D0%B5%D0%B4%D0%B2%D0%B5%D0%B4%D1%8C.png?raw=true', weight: 0 },
            { id: 4, name: 'Секрет', img: 'https://github.com/offlol666/images/blob/main/%D1%81%D1%83%D0%BC%D0%BA%D0%B0.png?raw=true', weight: 0 },
            { id: 5, name: 'Кубок', img: 'https://cdn-icons-png.flaticon.com/512/3112/3112946.png', weight: 0 },
            { id: 6, name: '10 Звезд', img: 'https://github.com/offlol666/images/blob/main/%D0%B7%D0%B2%D0%B5%D0%B7%D0%B4%D1%8B.png?raw=true', weight: 0 }
        ];

        const ITEM_WIDTH = 112; 
        const REPEATS = 8;        
        const ANIMATION_TIME = 6000; 

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getRandomIndexWithWeights(cost) {
            return 1; // Всегда «Пусто»
        }

        let currentTrackGifts = [];

        function initGifts() {
            track.innerHTML = '';
            currentTrackGifts = [];

            for(let i = 0; i < REPEATS + 2; i++) {
                const shuffledCycle = shuffleArray(allGifts);
                currentTrackGifts.push(...shuffledCycle);
            }

            currentTrackGifts.forEach(gift => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gift-item';
                itemDiv.innerHTML = `
                    <img src="${gift.img}" alt="${gift.name}">
                    <span>${gift.name}</span>
                `;
                track.appendChild(itemDiv);
            });

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
        }

        initGifts();

        // РЕАЛЬНЫЙ ЗАПРОС ОПЛАТЫ ЧЕРЕЗ СЕРВЕР И TELEGRAM STARS
        async function requestStarPayment(cost, callback) {
            try {
                // Обращаемся к вашему бэкенду за ссылкой на оплату (invoice_link)
                const response = await fetch(`https://ryletka1.onrender.com/api/create-invoice?cost=${cost}&userId=${userId}`);
                const data = await response.json();

                if (!data.invoice_link) {
                    alert("Ошибка создания счета от сервера");
                    callback(false);
                    return;
                }

                // Открываем нативное окно оплаты Telegram Stars
                tg.openInvoice(data.invoice_link, (status) => {
                    if (status === 'paid') {
                        callback(true); // Оплата прошла успешно
                    } else {
                        callback(false); // Пользователь отменил оплату
                    }
                });
            } catch (e) {
                console.error(e);
                alert("Не удалось связаться с сервером оплаты");
                callback(false);
            }
        }

        function startSpin(cost) {
            spinBtn10.disabled = true;
            spinBtn50.disabled = true;
            
            const activeBtn = cost === 10 ? spinBtn10 : spinBtn50;
            activeBtn.innerText = "Оплата...";
            resultMsg.innerText = ""; 
            statusSubtitle.innerText = "Подготовка счета...";

            // Запрашиваем реальное списание звезд перед запуском рулетки
            requestStarPayment(cost, (isPaid) => {
                if (!isPaid) {
                    spinBtn10.disabled = false;
                    spinBtn50.disabled = false;
                    spinBtn10.innerText = "Крутить за 10 ⭐";
                    spinBtn50.innerText = "Крутить за 50 ⭐";
                    statusSubtitle.innerText = `Ваш шанс выиграть приз: ${finalWinChance}%`;
                    resultMsg.innerHTML = `<span style="color: #ff6b6b;">❌ Оплата отменена</span>`;
                    return;
                }

                activeBtn.innerText = "Крутим...";
                statusSubtitle.innerText = "Ожидайте...";

                initGifts(); 
                
                const winningIndexOriginal = getRandomIndexWithWeights(cost);
                const winningGift = allGifts[winningIndexOriginal];

                const targetCycle = REPEATS - 1; 
                let targetIndex = -1;

                for (let i = targetCycle * allGifts.length; i < (targetCycle + 1) * allGifts.length; i++) {
                    if (currentTrackGifts[i].id === winningGift.id) {
                        targetIndex = i;
                        break;
                    }
                }
                if (targetIndex === -1) {
                    targetIndex = targetCycle * allGifts.length;
                }

                const containerCenter = (document.querySelector('.roulette-window').offsetWidth / 2) - (ITEM_WIDTH / 2);
                const side = Math.random() < 0.5 ? 1 : -1;
                const randomShift = (30 + Math.random() * 15) * side;

                const finalOffset = -(targetIndex * ITEM_WIDTH - containerCenter + randomShift);

                track.style.transition = `transform ${ANIMATION_TIME}ms cubic-bezier(0.15, 0.85, 0.1, 1)`;
                track.style.transform = `translateX(${finalOffset}px)`;

                setTimeout(() => {
                    track.style.transition = 'none';
                    track.style.transform = `translateX(${finalOffset}px)`;

                    spinBtn10.disabled = false;
                    spinBtn50.disabled = false;
                    spinBtn10.innerText = "Крутить за 10 ⭐";
                    spinBtn50.innerText = "Крутить за 50 ⭐";
                    
                    statusSubtitle.innerText = `Ваш шанс выиграть приз: ${finalWinChance}%`;

                    if (winningGift.name === 'Пусто') {
                        resultMsg.innerHTML = `<span style="color: #ff6b6b;">😔 Повезет в следующий раз!</span>`;
                    } else {
                        resultMsg.innerHTML = `<span style="color: #4cd137;">🎉 Поздравляем! Ваш приз: ${winningGift.name}</span>`;
                        inventory.push({ name: winningGift.name, img: winningGift.img });
                    }
                }, ANIMATION_TIME);
            });
        }

        function openInventory() {
            renderInventory();
            inventoryModal.style.display = 'flex';
        }

        function closeInventory() {
            inventoryModal.style.display = 'none';
        }

        function renderInventory() {
            inventoryList.innerHTML = '';

            if (inventory.length === 0) {
                inventoryList.innerHTML = `<div class="inventory-empty">Инвентарь пуст</div>`;
                return;
            }

            inventory.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'inventory-item';
                itemDiv.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div style="text-align: left; flex-grow: 1;">
                        <div style="font-weight: 600; font-size: 14px;">${item.name}</div>
                        <div style="font-size: 11px; color: #aaa;">Предмет #${index + 1}</div>
                    </div>
                `;
                inventoryList.appendChild(itemDiv);
            });
        }
    </script>
</body>
</html>
